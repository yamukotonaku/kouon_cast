# GitHub Pages に output/ を自動デプロイする
# トリガー: main への push で output/** が変わったとき（feed.xml や mp3 をコミットしたあと）
# 手動: Actions タブから "Run workflow" でも実行可能
# 事前にリポジトリの Settings > Pages > Source を "GitHub Actions" に設定してください

name: Deploy Podcast to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'output/**'   # output/ 以下が変わらない push では実行されない（feed 更新時は必ず output/ をコミットして push）
  workflow_dispatch:  # 手動で再デプロイしたいときに使用

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
